<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Zenox-SHOP-ZA</title>
    <link rel="stylesheet" href="../public/css/style.css">
</head>
<body>

<header>
    <h1>🛒 YOUR SHOPPING CART</h1>
</header>

<main>

    <h2>Selected Products</h2>

    <div id="cart-items">
        <p>Your cart is empty.</p>
    </div>

    <h3>Total Price: <span id="total-price">R0</span></h3>

    <hr>

    <h2>Free Fire UID</h2>

    <input
        type="text"
        id="uid"
        placeholder="Enter your Free Fire UID"
    >

    <br><br>

    <button onclick="confirmUID()">Continue</button>

</main>

<script src="../public/js/cart.js"></script>

</body>
</html>
